@for (stage of groupedMatches; track stage.title; let stageIndex = $index) {
  <section class="stage-block" aria-labelledby="stage-title-{{ stageIndex }}">
    <header>
      <h2 id="stage-title-{{ stageIndex }}">
        {{ stage.title }}
      </h2>
    </header>

    <div class="matches-grid">
      @for (group of stage.groups; track group.groupName || $index) {
        @for (match of group.matches; track match.id) {
          <article class="match-column">
            @if (group.groupName) {
              <p class="group-name">
                {{ group.groupName }}
              </p>
            }

            <app-match-card [match]="match"> </app-match-card>
          </article>
        }
      }
    </div>
  </section>
}
