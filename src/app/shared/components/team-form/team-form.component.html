<form class="team-form">
  <header>
    <h2>Creeaza echipa</h2>
  </header>

  <fieldset>
    <label for="team-name">Nume echipa</label>

    <input
      id="team-name"
      name="teamName"
      type="text"
      placeholder="Ex: FC Bucuresti"
      [(ngModel)]="team.name"
    />
  </fieldset>

  <fieldset>
    <label for="team-logo-input">Sigla echipei</label>

    <label class="upload-btn" for="team-logo-input">Alege sigla</label>

    <input id="team-logo-input" type="file" accept="image/*" (change)="upload($event)" />
  </fieldset>

  @if (team.logo) {
    <figure class="logo-preview">
      <img [src]="team.logo" alt="Sigla echipei" />
    </figure>
  }

  <section class="match-interval" aria-label="Perioada echipei">
    <fieldset>
      <label for="team-start-date">Data inceput</label>

      <input id="team-start-date" name="teamStartDate" type="date" [(ngModel)]="team.startDate" />
    </fieldset>

    <fieldset>
      <label for="team-end-date">Data sfarsit</label>

      <input id="team-end-date" name="teamEndDate" type="date" [(ngModel)]="team.endDate" />
    </fieldset>
  </section>
</form>
