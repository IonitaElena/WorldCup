<mgl-map class="map" [mapStyle]="mapStyle" [center]="center" [zoom]="zoom">
  <mgl-control mglNavigation position="top-right" [showCompass]="true" [showZoom]="true">
  </mgl-control>

  @for (team of teams; track team.id ?? team.team_id) {
    <mgl-marker [lngLat]="[team.lng, team.lat]">
      <app-team-marker
        [team]="team"
        (hover)="showTooltip($event)"
        (leave)="hideTooltip()"
        (clickTeam)="openTeam($event)"
      >
      </app-team-marker>
    </mgl-marker>
  }

  @if (hoveredTeam) {
    <mgl-popup [lngLat]="[hoveredTeam.lng, hoveredTeam.lat]" [closeButton]="false">
      {{ hoveredTeam.name_en }}
    </mgl-popup>
  }
</mgl-map>

@if (teamDetails) {
  <aside aria-label="Detalii echipa">
    <app-team-details
      [data]="teamDetails"
      (close)="closeDetails()"
      (playerClick)="openPlayer($event)"
    >
    </app-team-details>
  </aside>
}

@if (selectedPlayer) {
  <aside aria-label="Detalii jucator">
    <app-player-details [player]="selectedPlayer" (close)="closePlayer()"> </app-player-details>
  </aside>
}
