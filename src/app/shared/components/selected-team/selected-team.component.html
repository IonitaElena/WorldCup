<h2>Echipa mea ({{ selectedPlayers.length }}/11)</h2>

<div
  cdkDropList
  id="team"
  [cdkDropListData]="selectedPlayers"
  [cdkDropListConnectedTo]="['players']"
  (cdkDropListDropped)="drop($event)"
>
  <div *ngFor="let player of selectedPlayers" cdkDrag class="player-card">
    <img [src]="player.photo" [alt]="player.name" class="player-photo" />

    <div class="player-info">
      <strong>{{ player.name }}</strong>
    </div>
  </div>
</div>
