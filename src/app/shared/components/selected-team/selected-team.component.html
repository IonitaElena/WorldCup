<section aria-labelledby="selected-team-title">
  <h2 id="selected-team-title">Echipa mea ({{ selectedPlayers.length }}/11)</h2>

  <ul
    cdkDropList
    id="team"
    [cdkDropListData]="selectedPlayers"
    [cdkDropListConnectedTo]="['players']"
    (cdkDropListDropped)="drop($event)"
  >
    @for (player of selectedPlayers; track player.id ?? player.name) {
      <li cdkDrag class="player-card">
        <img [src]="player.photo" [alt]="player.name" class="player-photo" />

        <div class="player-info">
          <strong>{{ player.name }}</strong>
        </div>
      </li>
    }
  </ul>
</section>
