<section class="column" aria-labelledby="knockout-column-title">
  <header>
    <h2 id="knockout-column-title">{{ title }}</h2>
  </header>

  <ol class="matches">
    @for (match of matches; track match.id) {
      <li>
        <app-knockout-match-card [match]="match"></app-knockout-match-card>
      </li>
    }
  </ol>
</section>
